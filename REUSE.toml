# REUSE.toml — per-path licence map (https://reuse.software, spec 3.3).
# When several annotations match a file, the LAST one wins: order runs general → specific.
# `precedence = "closest"` lets an SPDX header written inside a file override its path default.
#
# Rules (principles/PRI-005, standards/STD-010 in numinia-archive): the engine is core, so code is
# AGPL-3.0-only; explanatory texts are CC-BY-4.0; assets keep the licence of their source (almost
# all CC0); anything third-party keeps its own licence and its own copyright holder.
# Per-asset provenance (author, source URL, checks) lives next to the files in activos/**/LICENCIAS.md.

version = 1
SPDX-PackageName = "numinia-engine"
SPDX-PackageSupplier = "Numen Games S.L."
SPDX-PackageDownloadLocation = "https://github.com/numengames/numinia-engine"

# ── Default: code, tools, tests, scripts, data and configuration ─────────────
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "AGPL-3.0-only"

# ── Assets (activos/): CC0 own work, or CC0 from a third-party author ────────
# Own work: generated by tools/hacer-*.mjs, byte for byte reproducible.
[[annotations]]
path = [
  "activos/bolitas/**",
  "activos/casa/**",
  "activos/graboso/**",
  "activos/terreno/**",
  "activos/espacio-base/**",
  "plantillas/apps/bloque-giratorio/assets/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "CC0-1.0"

# Robot (RobotExpressive.glb): Quaternius model, CC0, as shipped in the three.js examples.
[[annotations]]
path = "activos/robot/**"
precedence = "closest"
SPDX-FileCopyrightText = [
  "Tomás Laulhé (Quaternius)",
  "Don McCurdy",
]
SPDX-License-Identifier = "CC0-1.0"

# Avatars: Polygonal Mind 100Avatars, CC0 inside each VRM and at the source.
[[annotations]]
path = "activos/avatares/**"
precedence = "closest"
SPDX-FileCopyrightText = [
  "Polygonal Mind",
  "2026 Numen Games S.L.",
]
SPDX-License-Identifier = "CC0-1.0"

# Animations: Quaternius Universal Animation Library (UAL1), CC0, converted to .vrma by tools/vrma.
[[annotations]]
path = "activos/animaciones/**"
precedence = "closest"
SPDX-FileCopyrightText = [
  "Quaternius",
  "2026 Numen Games S.L.",
]
SPDX-License-Identifier = "CC0-1.0"

# Ground textures and sky: Poly Haven, CC0, re-encoded to WebP / lightened.
[[annotations]]
path = [
  "activos/texturas/**",
  "activos/cielos/**",
]
precedence = "closest"
SPDX-FileCopyrightText = [
  "Charlotte Baglioni (Poly Haven)",
  "Rob Tuytel (Poly Haven)",
  "Greg Zaal (Poly Haven)",
  "Jarod Guest (Poly Haven)",
  "2026 Numen Games S.L.",
]
SPDX-License-Identifier = "CC0-1.0"

# Sounds: CC0 from Kenney.nl and OpenGameArt authors, trimmed and re-encoded, plus the ambience
# bed given to Numinia as CC0 (its author is still to be named; see activos/sonidos/LICENCIAS.md).
# Per-file author and source: features/sonido/catalogo.json.
[[annotations]]
path = "activos/sonidos/**"
precedence = "closest"
SPDX-FileCopyrightText = [
  "Fantozzi (qubodup)",
  "Kenney Vleugels (kenney.nl)",
  "Peludo",
  "Sadiquecat",
  "Thimras",
  "TinyWorlds",
  "artisticdude",
  "pyranostudios",
  "rubberduck",
  "2026 Numen Games S.L.",
]
SPDX-License-Identifier = "CC0-1.0"

# Portraits of the CC0 avatars, rendered by tools/retratos.mjs.
[[annotations]]
path = "apps/plaza/public/retratos/**"
precedence = "closest"
SPDX-FileCopyrightText = [
  "Polygonal Mind",
  "2026 Numen Games S.L.",
]
SPDX-License-Identifier = "CC0-1.0"

# PWA icons: the Khepri mark, a brand mark, so reserved (see TRADEMARKS.md).
[[annotations]]
path = "apps/plaza/public/iconos/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "LicenseRef-Numen-AllRightsReserved"

# ── Third-party: keeps its upstream licence and copyright holder ─────────────
# Fonts (self-hosted): Geist (Vercel, basement.studio) and Bebas Neue (Dharma Type), SIL OFL 1.1.
[[annotations]]
path = [
  "apps/plaza/public/fuentes/Geist-Variable.woff2",
  "apps/plaza/public/fuentes/GeistMono-Variable.woff2",
  "apps/plaza/public/fuentes/LICENSE-Geist.txt",
]
precedence = "closest"
SPDX-FileCopyrightText = "2023 Vercel, in collaboration with basement.studio"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = [
  "apps/plaza/public/fuentes/BebasNeue-Regular.woff2",
  "apps/plaza/public/fuentes/LICENSE-BebasNeue.txt",
]
precedence = "closest"
SPDX-FileCopyrightText = [
  "2019 The Bebas Neue Project Authors (https://github.com/dharmatype/Bebas-Neue)",
  "2010 Dharma Type",
]
SPDX-License-Identifier = "OFL-1.1"

# Phosphor Icons: the glyph paths in this file are copied from the MIT package (regular weight);
# the rest of the file is the engine's own code.
[[annotations]]
path = "apps/plaza/iconos.ts"
precedence = "closest"
SPDX-FileCopyrightText = [
  "2026 Numen Games S.L.",
  "2023 Phosphor Icons (https://phosphoricons.com)",
]
SPDX-License-Identifier = "AGPL-3.0-only AND MIT"

# Foliage crown: copies and transforms parts of Bruno Simon's folio-2025 Foliage.js (MIT) and of
# three.js ForestGenerator.js (MIT); see the comment at the top of the file.
[[annotations]]
path = "packages/render/src/naturaleza/follaje.ts"
precedence = "closest"
SPDX-FileCopyrightText = [
  "2026 Numen Games S.L.",
  "2025 Bruno Simon",
  "2010-2026 three.js authors",
]
SPDX-License-Identifier = "AGPL-3.0-only AND MIT"

# ── Documentation: explanatory texts, reusable with credit ───────────────────
# Last on purpose: the LICENCIAS.md notes inside activos/ are texts too.
[[annotations]]
path = [
  "**/*.md",
  "llms.txt",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "CC-BY-4.0"

# ── The Blank World template (decision of Pablo, 2026-11-07): its content is CC0 ─────
# Last on purpose (the last matching annotation wins): this beats the engine's AGPL default and the CC-BY of *.md.
# Content only: the engine's licence is not touched. No Numen/Numinia logo or wordmark is shipped here (trademarks,
# TRADEMARKS.md); if one is ever added, give it its OWN exact-path annotation below this one with
# LicenseRef-Numen-AllRightsReserved. See plantillas/blank-world/aventura/LICENSE.md.
[[annotations]]
path = "plantillas/blank-world/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "CC0-1.0"
