<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Mundo</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #c9d8e4; font: 13px/1.45 system-ui, sans-serif; }
    canvas { display: block; touch-action: none; }
    /* auditoría UI móvil: ancho topado a la pantalla (antes "white-space: pre" nunca envolvía y el
       texto largo se salía por el borde derecho, oculto bajo el minimapa); cada .linea recorta con "…" */
    #hud { position: fixed; top: 10px; left: 10px; max-width: calc(100vw - 20px); box-sizing: border-box; padding: 8px 10px; border-radius: 8px; background: rgba(20, 24, 30, .72); color: #eef2f6; pointer-events: none; }
    #mundo-lleno { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(480px, calc(100vw - 32px)); margin: 0; padding: 16px 20px; border-radius: 10px; background: rgba(20, 24, 30, .92); color: #eef2f6; font-size: 16px; line-height: 1.4; text-align: center; z-index: 20; }
    #hud b { color: #ffd27a; font-weight: 600; }
    #hud .linea { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
    /* en móvil (pantalla estrecha o táctil) el HUD comparte la fila superior con la barra de iconos:
       se recorta a su ancho disponible y se oculta la línea de depuración (huella navegador=servidor,
       no esencial para jugar) para que no empuje el HUD contra el minimapa */
    @media (max-width: 600px), (pointer: coarse) {
      #hud { max-width: calc(100vw - 220px); font-size: 11px; }
      #hud .detalle { display: none; }
    }
    #help { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100vw - 20px); text-align: center; color: #23303b; opacity: .8; pointer-events: none; }
    #vr { position: fixed; top: 56px; right: 10px; padding: 10px 14px; border: 0; border-radius: 8px; background: #9ad0ff; color: #23303b; font: inherit; font-weight: 600; }
    #ar { position: fixed; top: 10px; right: 10px; padding: 10px 14px; border: 0; border-radius: 8px; background: #ffd27a; color: #23303b; font: inherit; font-weight: 600; }
    #joy { position: fixed; width: 110px; height: 110px; border-radius: 50%; background: rgba(20,24,30,.25); display: none; pointer-events: none; }
    #knob { position: absolute; left: 35px; top: 35px; width: 40px; height: 40px; border-radius: 50%; background: rgba(20,24,30,.55); }
    #acciones { position: fixed; right: 10px; bottom: 40px; display: flex; flex-direction: column; gap: 8px; }
    #acciones button { padding: 10px 14px; border: 0; border-radius: 8px; background: rgba(20, 24, 30, .72); color: #ffd27a; font: inherit; font-weight: 600; }
    #construir { position: fixed; top: 102px; right: 10px; display: none; padding: 10px 14px; border: 0; border-radius: 8px; background: #c9b6ff; color: #23303b; font: inherit; font-weight: 600; }
    #pantalla { position: fixed; top: 112px; left: 10px; padding: 8px 12px; border: 0; border-radius: 8px; background: rgba(20, 24, 30, .72); color: #eef2f6; font: inherit; font-weight: 600; }
    #panel-construir { position: fixed; top: 150px; right: 10px; width: 300px; max-height: calc(100% - 210px); overflow: auto; padding: 8px 10px; border-radius: 8px; background: rgba(20, 24, 30, .82); color: #eef2f6; }
    body.construyendo #minimapa { visibility: hidden; } /* while building the panel owns the right side (the minimap covered «Borrar» and the inspector) */
    #panel-construir h2 { margin: 0 0 4px; font-size: 15px; color: #ffd27a; }
    #panel-construir p { margin: 6px 0 4px; }
    #panel-construir .fila { display: flex; flex-wrap: wrap; gap: 6px; }
    #panel-construir button { padding: 7px 9px; border: 0; border-radius: 6px; background: #eef2f6; color: #23303b; font: inherit; }
    #panel-construir button:focus-visible { outline: 3px solid #ffd27a; }
    #panel-construir .estado { color: #ffd27a; min-height: 1.4em; }
    /* J3: the chat box, bottom left: the list is always there (an empty one takes no room), the input opens with Enter */
    #chat { position: fixed; left: 10px; bottom: 34px; width: min(380px, 62vw, calc(100vw - 240px)); display: flex; flex-direction: column; gap: 4px; }
    /* auditoría UI móvil: en pantalla estrecha o táctil el minimapa/misiones viven arriba a la derecha
       (no comparten fila con el chat, que está abajo), así que no hace falta reservar 240px a su derecha;
       antes el campo de texto quedaba en ~80px (el placeholder se cortaba a media palabra) */
    @media (max-width: 600px), (pointer: coarse) { #chat { width: calc(100vw - 20px); } }
    #chat-lista { margin: 0; padding: 6px 10px; list-style: none; max-height: min(30vh, 210px); overflow-y: auto; border-radius: 8px; background: rgba(20, 24, 30, .62); color: #eef2f6; overflow-wrap: anywhere; }
    #chat-lista:empty { padding: 0; background: transparent; }
    #chat-lista b { color: #9ad0ff; font-weight: 600; }
    #chat-lista .zona b { color: #c9b6ff; }
    #chat-lista .antes { opacity: .7; }
    #chat-lista .aviso { color: #ffd27a; font-style: italic; }
    #chat-form { display: flex; gap: 6px; }
    #chat-form[hidden] { display: none; }
    #chat-texto { flex: 1; min-width: 0; padding: 8px 10px; border: 0; border-radius: 8px; background: #f4f7fb; color: #17202a; font: inherit; font-size: 15px; }
    #chat-canal, #chat-boton { padding: 8px 12px; border: 0; border-radius: 8px; background: #9ad0ff; color: #23303b; font: inherit; font-weight: 600; }
    #chat-boton { align-self: flex-start; }
    #chat-texto:focus-visible, #chat-canal:focus-visible, #chat-boton:focus-visible { outline: 3px solid #ffd27a; }
    #chat .estado { margin: 0; color: #23303b; min-height: 0; }
    #chat .estado:not(:empty) { padding: 3px 8px; border-radius: 6px; background: rgba(238, 242, 246, .85); }
    /* J4/J5: the prompt «E: hablar con…», the conversation box, the quest book, the tracked step and a short note */
    #interactuar { position: fixed; bottom: 72px; left: 50%; transform: translateX(-50%); padding: 8px 14px 8px 30px; border: 0; border-radius: 8px; background: rgba(20, 24, 30, .82); color: #ffd27a; font: inherit; font-weight: 600; }
    /* J4 mantener-pulsado: a small progress ring grows clockwise (--progreso 0..1) while E/the button/the VR trigger is held */
    #interactuar::before { content: ""; position: absolute; left: 8px; top: 50%; translate: 0 -50%; width: 14px; height: 14px; border-radius: 50%; visibility: hidden; background: conic-gradient(#ffd27a calc(var(--progreso, 0) * 360deg), rgba(255, 255, 255, .25) 0); }
    #interactuar.manteniendo::before { visibility: visible; }
    #dialogo { position: fixed; bottom: 72px; left: 50%; transform: translateX(-50%); width: min(560px, calc(100% - 20px)); max-height: calc(100% - 90px); overflow: auto; box-sizing: border-box; padding: 10px 12px; border-radius: 10px; background: rgba(20, 24, 30, .9); color: #eef2f6; }
    #dialogo h2 { margin: 0 0 4px; font-size: 15px; color: #ffd27a; }
    #dialogo .texto { margin: 0 0 8px; }
    #dialogo .opciones { display: flex; flex-direction: column; gap: 6px; }
    #dialogo button { padding: 7px 10px; border: 0; border-radius: 6px; background: #eef2f6; color: #23303b; font: inherit; text-align: left; }
    #dialogo button:focus-visible, #libro button:focus-visible, #misiones:focus-visible, #interactuar:focus-visible { outline: 3px solid #ffd27a; }
    #dialogo .adios { margin-top: 8px; background: transparent; color: #eef2f6; text-decoration: underline; }
    #dialogo .estado { margin: 6px 0 0; color: #ffb4a8; min-height: 1em; }
    #misiones { position: fixed; left: 10px; bottom: 10px; padding: 8px 12px; border: 0; border-radius: 8px; background: #ffd27a; color: #23303b; font: inherit; font-weight: 600; }
    /* the book opens top left, under the HUD and «Pantalla completa», over the chat (it used to open behind the chat) */
    #libro { position: fixed; left: 10px; top: 156px; z-index: 5; width: 320px; max-width: calc(100% - 20px); max-height: max(160px, calc(100% - 420px)); overflow: auto; box-sizing: border-box; padding: 8px 10px; border-radius: 8px; background: rgba(20, 24, 30, .88); color: #eef2f6; }
    #libro h2 { margin: 0 0 6px; font-size: 15px; color: #ffd27a; }
    #libro h3 { margin: 8px 0 2px; font-size: 14px; }
    #libro p, #libro ol, #libro ul { margin: 2px 0 6px; }
    #libro ol, #libro ul { padding-left: 18px; }
    #libro li.hecho { color: #9fe0a0; } #libro li.ahora { color: #ffd27a; font-weight: 600; } #libro li.bloqueado { opacity: .7; } /* the look: tema.css */
    #libro .fila { display: flex; gap: 6px; }
    #libro button { padding: 5px 9px; border: 0; border-radius: 6px; background: #eef2f6; color: #23303b; font: inherit; }
    #mision-seguida { position: fixed; top: 156px; left: 10px; z-index: 4; max-width: calc(100% - 150px); margin: 0; padding: 5px 10px; border-radius: 8px; background: rgba(20, 24, 30, .72); color: #ffd27a; pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #mision-nota { position: fixed; top: 34%; left: 50%; transform: translateX(-50%); max-width: calc(100% - 40px); padding: 6px 12px; border-radius: 8px; background: rgba(255, 210, 122, .95); color: #23303b; font-weight: 600; text-align: center; pointer-events: none; }
    /* V1: what happens, for screen readers (not shown on screen; the voice of V3 comes later) */
    #fundido { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 40; } /* D-045: the fade when the server puts you back on a safe spot (features/suelo) */
    .solo-lector { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
    /* N2: the settings menu (a real <dialog>: keyboard, touch and screen readers) and what its settings change */
    :root { --ui: 1; }
    body > :not(canvas):not(#joy):not(#web-capa) { zoom: var(--ui); } /* «Tamaño de la interfaz»: everything on the screen but the world (and the web screens, which live in it) */
    #ajustes-abrir { position: fixed; top: 10px; right: 10px; width: 44px; height: 44px; padding: 0; border: 0; border-radius: 8px; background: rgba(20, 24, 30, .72); color: #eef2f6; font: inherit; font-size: 22px; line-height: 44px; }
    #ajustes-abrir[hidden] { display: none; }
    #ar[hidden], #vr[hidden] { display: none; } /* AR/VR start hidden (attribute): only a device that can do it shows them */
    #ar, #vr, #construir { right: 62px; } /* the gear takes the corner: AR, VR and Construir move one button to the left */
    #ajustes { position: fixed; inset: 10px 10px auto auto; margin: 0; width: min(390px, calc(100vw - 20px)); max-height: calc((100vh - 20px) / var(--ui)); overflow: auto; padding: 10px 12px 12px; border: 0; border-radius: 10px; background: rgb(20, 24, 30); color: #eef2f6; box-sizing: border-box; }
    #ajustes::backdrop { background: rgba(10, 14, 20, .25); }
    #ajustes .cabecera { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    #ajustes h2 { margin: 0; font-size: 1.25em; color: #ffd27a; }
    #ajustes fieldset { margin: 10px 0 0; padding: 4px 10px 6px; border: 1px solid rgba(238, 242, 246, .25); border-radius: 8px; }
    #ajustes legend { padding: 0 4px; font-weight: 600; color: #9ad0ff; }
    #ajustes .ajuste { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; padding: 6px 0; border-top: 1px solid rgba(238, 242, 246, .08); }
    #ajustes .ajuste[hidden], #ajustes fieldset[hidden] { display: none; }
    #ajustes .ajuste label, #ajustes .ajuste .nombre { flex: 1 1 auto; font-weight: 600; }
    #ajustes .ajuste input[type="checkbox"] { width: 22px; height: 22px; margin: 0; accent-color: #ffd27a; }
    #ajustes .ajuste input[type="range"] { flex: 1 1 100%; height: 28px; margin: 0; accent-color: #ffd27a; }
    #ajustes .ajuste select { min-height: 32px; padding: 2px 6px; border: 0; border-radius: 6px; background: #eef2f6; color: #23303b; font: inherit; }
    #ajustes .ajuste output { font-variant-numeric: tabular-nums; color: #ffd27a; }
    #ajustes .describe, #ajustes .nota { flex: 1 1 100%; margin: 0; font-size: .9em; opacity: .8; }
    #ajustes .nota { color: #ffd27a; opacity: 1; }
    #ajustes kbd, #ajustes .teclas kbd { display: inline-block; min-width: 1.4em; padding: 1px 6px; border: 1px solid #eef2f6; border-radius: 4px; text-align: center; font: inherit; font-weight: 600; }
    #ajustes .teclas { margin: 6px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 4px 12px; }
    #ajustes button { min-height: 36px; padding: 6px 12px; border: 0; border-radius: 6px; background: #eef2f6; color: #23303b; font: inherit; font-weight: 600; }
    #ajustes .pie { margin-top: 10px; }
    #ajustes .estado { min-height: 1.4em; margin: 4px 0 0; color: #ffd27a; }
    #ajustes :focus-visible, #ajustes-abrir:focus-visible { outline: 3px solid #ffd27a; outline-offset: 1px; }
    html.texto-grande body { font-size: 18px; }
    html.alto-contraste #hud, html.alto-contraste #ajustes, html.alto-contraste #panel-construir, html.alto-contraste #acciones button, html.alto-contraste #ajustes-abrir { background: #000; color: #fff; outline: 2px solid #fff; }
    @media (min-width: 900px) { #help { max-width: calc(100vw - 480px); } } /* between «Misiones» and the minimap */
    html.alto-contraste #help { background: #fff; color: #000; opacity: 1; padding: 2px 6px; border-radius: 4px; }
    html.alto-contraste #ajustes .describe { opacity: 1; }
    html.alto-contraste :focus-visible { outline: 3px solid #ffeb3b !important; outline-offset: 2px; }
    html.menos-movimiento *, html.menos-movimiento *::before, html.menos-movimiento *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  /* auditoría UI móvil: objetivo táctil mínimo 44x44 px (Apple HIG / Material) para los controles que
     en escritorio ya iban sobrados de ratón pero en el dedo quedaban en 28-39px: el libro de misiones,
     saltar/saludar/bailar/recoger, abrir el chat, los botones del minimapa (−/+/N/Mapa/Ficha) y la fila
     de un ajuste (para que tocar cerca del interruptor, no solo encima del cuadrito de 22px, lo cambie) */
  @media (pointer: coarse) {
    #misiones, #chat-boton { min-height: 44px; }
    #acciones button { min-height: 44px; min-width: 64px; }
    #minimapa .botones button { min-width: 44px; min-height: 44px; }
    #ajustes .ajuste { min-height: 44px; padding: 10px 0; }
    #ajustes .ajuste input[type="checkbox"] { width: 26px; height: 26px; }
  }
    /* U1: the loading screen. Shell + controller live in this page (≤ 14 kB gz, system font, no canvas, no per-frame work);
       the picture (carga.webp, ≤ 45 kB) arrives after the first paint. Bar by phases: never indeterminate. */
    #carga { position: fixed; inset: 0; width: 100%; height: 100%; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: #1d2a38; color: #f2f5f8; overflow: hidden; }
    #carga:not([open]) { display: none; }
    #carga::backdrop { background: #1d2a38; }
    #carga-arte { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .4s; }
    #carga-arte.ya { opacity: .9; }
    #carga .c-caja { position: absolute; left: 50%; bottom: 9%; transform: translateX(-50%); width: min(420px, calc(100vw - 40px)); padding: 14px 16px 16px; border-radius: 12px; background: rgba(14, 20, 28, .78); text-align: center; }
    #carga h1 { margin: 0 0 4px; font-size: 20px; font-weight: 600; letter-spacing: .04em; }
    #carga .c-fase { margin: 0 0 10px; min-height: 1.4em; }
    #carga .c-fila { display: flex; align-items: center; gap: 12px; }
    #carga-b { flex: 1; height: 4px; border: 0; border-radius: 2px; background: rgba(242, 245, 248, .25); appearance: none; -webkit-appearance: none; overflow: hidden; }
    #carga-b::-webkit-progress-bar { background: rgba(242, 245, 248, .25); border-radius: 2px; }
    #carga-b::-webkit-progress-value { background: #ffd27a; border-radius: 2px; transition: width .25s; }
    #carga-b::-moz-progress-bar { background: #ffd27a; border-radius: 2px; }
    #carga-n { min-width: 4.2em; text-align: right; font: 13px/1 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
    #carga .c-aviso { margin: 10px 0 0; min-height: 1.4em; color: #ffd27a; }
    #carga .c-botones { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
    #carga .c-botones[hidden] { display: none; }
    #carga button { min-height: 40px; padding: 8px 16px; border: 0; border-radius: 8px; background: #eef2f6; color: #23303b; font: inherit; font-weight: 600; }
    #carga button:focus-visible { outline: 3px solid #ffd27a; outline-offset: 2px; }
    canvas:focus { outline: none; }
    @media (prefers-reduced-motion: reduce) { #carga-b::-webkit-progress-value, #carga-arte { transition: none; } }
  </style>
  <link rel="stylesheet" href="./tema.css" /><!-- U11: Numinia Design System (colours, type, icons) and the right-hand layout -->
</head>
<body>
  <!-- U1: the loading screen. Static shell first, the controller right below it (no module, no canvas); main.ts feeds it
       the real phases through window.__numinia.carga. It shows only if the wait passes 400 ms and stays at least 600 ms. -->
  <dialog id="carga" aria-labelledby="carga-t" aria-describedby="carga-f">
    <img id="carga-arte" alt="" width="1280" height="720" decoding="async" />
    <div class="c-caja">
      <h1 id="carga-t">Numinia</h1>
      <p id="carga-f" class="c-fase">Cargando el motor</p>
      <div class="c-fila"><progress id="carga-b" max="100" value="0" aria-label="Carga del mundo"></progress><output id="carga-n">0 %</output></div>
      <p id="carga-aviso" class="c-aviso" role="alert"></p>
      <p id="carga-voz" class="solo-lector" role="status" aria-live="polite"></p>
      <div id="carga-botones" class="c-botones" hidden></div>
    </div>
  </dialog>
  <script>
(function () {
  var $ = function (i) { return document.getElementById(i); }, d = $("carga");
  if (!d) return;
  // [phase, words, weight of the bar]: the clock never moves the bar, only real signals do
  var F = [["codigo", "Cargando el motor", 30], ["grafica", "Preparando la gráfica", 10], ["red", "Conectando", 15], ["mundo", "Descargando el mundo", 30], ["preparar", "Preparando", 15], ["listo", "Listo", 0]];
  var c = { fase: "codigo", hecho: 0, total: 0, unidad: "", estado: "cargando", pct: 0, avisos: 0, mostrada: false };
  var ini = 0, visto = 0, ult = Date.now(), tm = 0;
  window.__numinia = { carga: c, probe: { done: false }, session: { entity: -1 } }; // stub until main.ts replaces it
  document.body.setAttribute("aria-busy", "true");
  d.addEventListener("cancel", function (e) { e.preventDefault(); }); // Esc never closes it
  var mb = function (b) { return (b / 1048576).toFixed(1).replace(".", ","); };
  function idx(n) { for (var i = 0; i < F.length; i++) if (F[i][0] === n) return i; return 0; }
  function pintar() {
    var i = idx(c.fase), p = 0, k, t = F[i][1];
    for (k = 0; k < i; k++) p += F[k][2];
    if (c.total > 0) p += F[i][2] * Math.min(1, c.hecho / c.total);
    c.pct = c.fase === "listo" ? 100 : Math.max(c.pct, Math.min(99, Math.round(p)));
    if (c.total > 0 && c.unidad === "bytes") t += " \u00b7 " + mb(c.hecho) + " de " + mb(c.total) + " MB"; else if (c.total > 1) t += " \u00b7 " + c.hecho + " de " + c.total;
    $("carga-b").value = c.pct; $("carga-n").textContent = c.pct + " %"; $("carga-f").textContent = t;
  }
  function mostrar() {
    tm = 0;
    if (c.fase === "listo" || d.open) return;
    try { d.showModal(); } catch (e) { d.setAttribute("open", ""); }
    c.mostrada = true; ini = Date.now();
    requestAnimationFrame(function () { var im = $("carga-arte"); im.onload = function () { im.className = "ya"; }; im.src = "carga.webp"; }); // after the first paint
  }
  function botones(l) {
    var b = $("carga-botones"); b.textContent = ""; b.hidden = !l.length;
    l.forEach(function (x) { var e = document.createElement("button"); e.type = "button"; e.textContent = x[0]; e.onclick = x[1]; b.appendChild(e); });
    if (l.length && d.open) b.firstChild.focus();
  }
  c.irA = function (n, h, t, u) { // phase n (the earlier ones are done); h of t done inside it (u = "bytes" or a count)
    if (c.fase === "listo") return;
    var cambia = n !== c.fase || h !== c.hecho;
    if (n !== c.fase && c.avisos < 6) { c.avisos++; $("carga-voz").textContent = F[idx(n)][1]; }
    c.fase = n; c.hecho = h || 0; c.total = t || 0; c.unidad = u || "";
    if (cambia) { ult = Date.now(); if (c.estado === "atascado") { c.estado = "cargando"; $("carga-aviso").textContent = ""; botones([]); } }
    pintar();
  };
  c.mensaje = function (estado, titulo, texto, l) { // another state that needs the screen (a cut connection, leaving)
    c.msg = true; c.estado = estado; $("carga-t").textContent = titulo; $("carga-f").textContent = texto; $("carga-aviso").textContent = "";
    if (tm) { clearTimeout(tm); tm = 0; }
    document.body.removeAttribute("aria-busy");
    if (!d.open) { try { d.showModal(); } catch (e) { d.setAttribute("open", ""); } c.mostrada = true; ini = Date.now(); }
    botones(l || []);
  };
  c.texto = function (t) { $("carga-f").textContent = t; }; // a line changes (a countdown): the buttons stay where they are
  c.aviso = function (t) { $("carga-aviso").textContent = ""; $("carga-aviso").textContent = t; }; // role=alert: said at once
  c.ocultar = function () { // the screen is gone: only now «estado» says «listo» (checks and the menu wait for this)
    if (c.msg) return; // a cut connection or leaving took the screen meanwhile
    c.estado = "listo";
    if (d.open) d.close();
    document.body.removeAttribute("aria-busy");
    var cv = document.querySelector("canvas"); if (cv) { cv.tabIndex = -1; cv.focus({ preventScroll: true }); }
  };
  c.listo = function () {
    if (c.fase === "listo") return;
    c.fase = "listo"; c.hecho = c.total = 0; $("carga-voz").textContent = "Listo"; pintar();
    if (tm) { clearTimeout(tm); tm = 0; }
    if (c.mostrada) setTimeout(c.ocultar, Math.max(0, 600 - (Date.now() - ini))); else c.ocultar(); // once seen, it stays 600 ms
  };
  c.reintentar = function () { location.reload(); };
  c.cancelar = function () { c.estado = "cancelado"; $("carga-t").textContent = "Carga cancelada"; $("carga-f").textContent = "Puedes volver a intentarlo."; $("carga-aviso").textContent = ""; botones([["Reintentar", c.reintentar]]); };
  tm = setTimeout(mostrar, 400);
  setInterval(function () { // no progress for 8 s: say so and offer a way out
    if (c.estado !== "cargando" || c.fase === "listo" || Date.now() - ult < 8000) return;
    c.estado = "atascado"; mostrar(); c.aviso("Sigue trabajando\u2026 esto tarda m\u00e1s de lo normal.");
    botones([["Reintentar", c.reintentar], ["Cancelar", c.cancelar]]);
  }, 1000);
  pintar();
})();
  </script>
